<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2329" />
      <stop offset="100%" stop-color="#14171c" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c842" />
      <stop offset="100%" stop-color="#f0b90b" />
    </linearGradient>
  </defs>

  <!-- Background Squircle with subtle gold border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#f0b90b" stroke-width="2.5" stroke-opacity="0.85" />

  <!-- Clean modern text 212 -->
  <text 
    x="32" 
    y="40" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
    font-size="24" 
    font-weight="900" 
    letter-spacing="-1px"
    fill="url(#textGrad)" 
    text-anchor="middle"
  >212</text>
</svg>
